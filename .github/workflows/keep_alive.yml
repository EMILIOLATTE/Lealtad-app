name: Latte&Go Keep-Alive Programado

on:
  schedule:
    # Corre cada 10 min de 14:00 a 02:00 UTC (8:00 AM a 8:00 PM CDMX)
    - cron: '*/10 14-23,0-2 * * *'
  workflow_dispatch: # Permite probarlo manualmente con un clic en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar / Mantener activo Render
        run: |
          curl -s -o /dev/null -w "Código HTTP: %{http_code}\n" https://lealtad-app.onrender.com/ping
