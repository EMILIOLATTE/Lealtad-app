<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Barista | Latte&Go</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #2b1e16;
            color: #f7f4ef;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: #d4a373;
        }
        #reader {
            width: 100%;
            background: #1a120d;
            border-radius: 16px;
            overflow: hidden;
            margin: 16px 0;
            border: 2px solid #4a3427;
        }
        .manual-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }
        .manual-box input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a3427;
            background: #fff;
            color: #333;
            font-size: 1rem;
            text-align: center;
        }
        .manual-box button {
            background: #bc6c25;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .panel-cliente {
            display: none;
            background: #ffffff;
            color: #333333;
            border-radius: 20px;
            padding: 24px;
            margin-top: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .nombre-cliente {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4a3427;
            margin: 0;
        }
        .saldo-tag {
            font-size: 2.4rem;
            font-weight: 800;
            color: #bc6c25;
            margin: 10px 0;
        }
        .btn {
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-visita {
            background-color: #bc6c25;
            color: #ffffff;
            margin-top: 8px;
        }
        .btn-canje {
            background-color: #2a9d8f;
            color: #ffffff;
            margin-top: 12px;
        }
        .btn-reset {
            background-color: #e9ecef;
            color: #555555;
            margin-top: 14px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Notificación emergente Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #2a9d8f;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 9999;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.canje {
            background: #e76f51;
        }
    </style>
</head>
<body>
    <div id="toast" class="toast">¡Huellita registrada! 🐾</div>

    <div class="container">
        <h1>☕ Terminal Barista</h1>
        <p style="font-size:0.85rem; color:#bbb; margin:4px 0 14px;">Escanea el código QR o ingresa el identificador</p>

        <!-- Entrada manual de respaldo -->
        <div class="manual-box">
            <input type="text" id="input-manual" placeholder="ID o Token del cliente">
            <button onclick="buscarManual()">Buscar</button>
        </div>

        <!-- Lector de cámara -->
        <div id="reader"></div>

        <!-- Panel del Cliente -->
        <div id="panel" class="panel-cliente">
            <h2 id="cliente-nombre" class="nombre-cliente"></h2>
            <div id="cliente-saldo" class="saldo-tag">0 / 10</div>
            <p style="margin: 0 0 16px; font-size: 0.85rem; color: #777;">Huellitas acumuladas</p>

            <button class="btn btn-visita" id="btn-registrar-visita" onclick="enviarAccion('VISITA')">🐾 +1 Huellita (Registrar Visita)</button>
            <button id="btn-canje" class="btn btn-canje" onclick="enviarAccion('CANJE')" style="display: none;">🎉 Canjear Cortesía (10 pts)</button>

            <button class="btn btn-reset" onclick="reiniciarEscaneo()">Cancelar / Escanear otro</button>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let identificadorActual = null;
        let audioCtx = null;

        // Inicialización del motor de audio al interactuar
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Sonido 1: Warm Chime (Huellita normal)
        function sonarHuellita() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // Tono 1: Re5 (587.33 Hz)
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = "sine";
                osc1.frequency.setValueAtTime(587.33, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                // Tono 2: La5 (880 Hz)
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = "sine";
                osc2.frequency.setValueAtTime(880.00, now + 0.08);
                gain2.gain.setValueAtTime(0.2, now + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.28);
            } catch (e) {
                console.log("Audio no habilitado");
            }
        }

        // Sonido 2: Fanfarria de cortesía (Canje de 10 huellitas)
        function sonarCortesía() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notas = [523.25, 659.25, 783.99, 1046.50]; // Do5, Mi5, Sol5, Do6

                notas.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = now + (idx * 0.07);
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.22, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            } catch (e) {
                console.log("Audio no habilitado");
            }
        }

        function mostrarToast(mensaje, esCanje = false) {
            const toast = document.getElementById("toast");
            toast.textContent = mensaje;
            toast.className = esCanje ? "toast canje show" : "toast show";
            setTimeout(() => {
                toast.classList.remove("show");
            }, 1200);
        }

        function limpiarTextoQR(texto) {
            let str = String(texto).trim();
            if (str.includes("/")) {
                const partes = str.split("/").filter(p => p.trim().length > 0);
                str = partes[partes.length - 1];
            }
            return str;
        }

        async function cargarCliente(identificador) {
            if (!identificador) return;

            const urlPeticion = `/api/cliente/${identificador}`;
            try {
                const res = await fetch(urlPeticion);
                if (!res.ok) {
                    alert("Cliente no encontrado o código no válido.");
                    reiniciarEscaneo();
                    return;
                }
                const data = await res.json();
                identificadorActual = data.token_qr || data.id;

                document.getElementById("cliente-nombre").textContent = data.nombre;
                document.getElementById("cliente-saldo").textContent = `${data.huellitas_saldo} / 10`;
                
                const btnCanje = document.getElementById("btn-canje");
                btnCanje.style.display = data.huellitas_saldo >= 10 ? "block" : "none";

                document.getElementById("reader").style.display = "none";
                document.getElementById("panel").style.display = "block";
            } catch (e) {
                alert("Error de red al consultar el cliente.");
                reiniciarEscaneo();
            }
        }

        function buscarManual() {
            const val = document.getElementById("input-manual").value.trim();
            if (val) {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => cargarCliente(val)).catch(() => cargarCliente(val));
                } else {
                    cargarCliente(val);
                }
            } else {
                alert("Ingresa un identificador válido");
            }
        }

        function onScanSuccess(decodedText) {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    const idLimpio = limpiarTextoQR(decodedText);
                    cargarCliente(idLimpio);
                }).catch(err => console.error(err));
            }
        }

        function iniciarCamara() {
            document.getElementById("reader").style.display = "block";
            document.getElementById("panel").style.display = "none";
            document.getElementById("input-manual").value = "";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess
                ).catch(e => {
                    console.log("Cámara no activa o sin permisos");
                });
            });
        }

        async function enviarAccion(tipoAccion) {
            if (!identificadorActual) return;
            
            // Si es canje, pedimos confirmación rápida para evitar toques accidentales
            if (tipoAccion === 'CANJE' && !confirm("¿Confirmas canjear 10 huellitas por cortesía?")) {
                return;
            }

            const btnVisita = document.getElementById("btn-registrar-visita");
            const btnCanje = document.getElementById("btn-canje");
            btnVisita.disabled = true;
            btnCanje.disabled = true;

            const payload = {
                tipo_accion: tipoAccion
            };
            
            // Asigna token o cliente_id según corresponda
            if (String(identificadorActual).includes("-")) {
                payload.token = identificadorActual;
            } else {
                payload.cliente_id = parseInt(identificadorActual, 10);
            }

            try {
                const res = await fetch("/api/transaccion", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "Error al procesar");
                    btnVisita.disabled = false;
                    btnCanje.disabled = false;
                    return;
                }

                // 1. Reproducir sonido según el tipo de acción
                if (tipoAccion === 'CANJE') {
                    sonarCortesía();
                    mostrarToast("🎉 ¡Cortesía canjeada con éxito!", true);
                } else {
                    sonarHuellita();
                    mostrarToast("🐾 ¡Huellita registrada!", false);
                }

                // 2. Actualizar visualmente y reiniciar automáticamente la cámara tras 1.2 segundos
                document.getElementById("cliente-saldo").textContent = `${data.nuevo_saldo} / 10`;
                
                setTimeout(() => {
                    btnVisita.disabled = false;
                    btnCanje.disabled = false;
                    reiniciarEscaneo();
                }, 1200);

            } catch (e) {
                alert("Error al conectar con el servidor.");
                btnVisita.disabled = false;
                btnCanje.disabled = false;
            }
        }

        function reiniciarEscaneo() {
            identificadorActual = null;
            iniciarCamara();
        }

        window.addEventListener("DOMContentLoaded", iniciarCamara);
    </script>
</body>
</html>
