<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Barista | Latte&Go</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #2b1e16;
            color: #f7f4ef;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: #d4a373;
        }
        #reader {
            width: 100%;
            background: #1a120d;
            border-radius: 16px;
            overflow: hidden;
            margin: 16px 0;
            border: 2px solid #4a3427;
        }
        .manual-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }
        .manual-box input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a3427;
            background: #fff;
            color: #333;
            font-size: 1rem;
            text-align: center;
        }
        .manual-box button {
            background: #bc6c25;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .panel-cliente {
            display: none;
            background: #ffffff;
            color: #333333;
            border-radius: 20px;
            padding: 24px;
            margin-top: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .nombre-cliente {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4a3427;
            margin: 0;
        }
        .saldo-tag {
            font-size: 2.4rem;
            font-weight: 800;
            color: #bc6c25;
            margin: 10px 0;
        }
        .btn {
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-visita {
            background-color: #bc6c25;
            color: #ffffff;
            margin-top: 8px;
        }
        .btn-canje {
            background-color: #2a9d8f;
            color: #ffffff;
            margin-top: 12px;
        }
        .btn-reset {
            background-color: #e9ecef;
            color: #555555;
            margin-top: 14px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☕ Terminal Barista</h1>
        <p style="font-size:0.85rem; color:#bbb; margin:4px 0 14px;">Escanea el código QR o ingresa el ID</p>

        <!-- Entrada manual de respaldo -->
        <div class="manual-box">
            <input type="number" id="input-manual-id" placeholder="ID del cliente (ej. 1)">
            <button onclick="buscarManual()">Buscar</button>
        </div>

        <!-- Lector de cámara -->
        <div id="reader"></div>

        <!-- Panel del Cliente -->
        <div id="panel" class="panel-cliente">
            <h2 id="cliente-nombre" class="nombre-cliente"></h2>
            <div id="cliente-saldo" class="saldo-tag">0 / 10</div>
            <p style="margin: 0 0 16px; font-size: 0.85rem; color: #777;">Huellitas acumuladas</p>

            <!-- Botón único de visita -->
            <button class="btn btn-visita" onclick="enviarAccion('VISITA')">🐾 +1 Huellita (Registrar Visita)</button>
            
            <!-- Botón condicional de cortesía -->
            <button id="btn-canje" class="btn btn-canje" onclick="enviarAccion('CANJE')" style="display: none;">🎉 Canjear Cortesía (10 pts)</button>

            <button class="btn btn-reset" onclick="reiniciarEscaneo()">Escanear siguiente cliente</button>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let clienteActualId = null;

        function limpiarId(texto) {
            let str = String(texto).trim();
            if (str.includes("/")) {
                const partes = str.split("/").filter(p => p.trim().length > 0);
                str = partes[partes.length - 1];
            }
            return parseInt(str, 10);
        }

        async function cargarClientePorId(id) {
            if (!id || isNaN(id)) {
                alert("ID inválido: " + id);
                reiniciarEscaneo();
                return;
            }

            const urlPeticion = `/api/cliente/${id}`;
            try {
                const res = await fetch(urlPeticion);
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => null);
                    alert(errorJson ? errorJson.detail : `Error al consultar cliente.`);
                    reiniciarEscaneo();
                    return;
                }
                const data = await res.json();
                clienteActualId = data.id;

                document.getElementById("cliente-nombre").textContent = data.nombre;
                document.getElementById("cliente-saldo").textContent = `${data.huellitas_saldo} / 10`;
                
                const btnCanje = document.getElementById("btn-canje");
                btnCanje.style.display = data.huellitas_saldo >= 10 ? "block" : "none";

                document.getElementById("reader").style.display = "none";
                document.getElementById("panel").style.display = "block";
            } catch (e) {
                alert("Error de red al consultar el cliente.");
                reiniciarEscaneo();
            }
        }

        function buscarManual() {
            const val = document.getElementById("input-manual-id").value;
            const id = parseInt(val, 10);
            if (id) {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().then(() => cargarClientePorId(id)).catch(() => cargarClientePorId(id));
                } else {
                    cargarClientePorId(id);
                }
            } else {
                alert("Ingresa un número de ID válido");
            }
        }

        function onScanSuccess(decodedText) {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    const id = limpiarId(decodedText);
                    cargarClientePorId(id);
                }).catch(err => console.error(err));
            }
        }

        function iniciarCamara() {
            document.getElementById("reader").style.display = "block";
            document.getElementById("panel").style.display = "none";
            document.getElementById("input-manual-id").value = "";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess
                ).catch(e => {
                    console.log("Cámara no activa o sin permisos");
                });
            });
        }

        async function enviarAccion(tipoAccion) {
            if (!clienteActualId) return;
            try {
                const res = await fetch("/api/transaccion", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cliente_id: clienteActualId,
                        tipo_accion: tipoAccion
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "Error al procesar");
                    return;
                }

                alert(data.mensaje);
                document.getElementById("cliente-saldo").textContent = `${data.nuevo_saldo} / 10`;
                document.getElementById("btn-canje").style.display = data.nuevo_saldo >= 10 ? "block" : "none";
            } catch (e) {
                alert("Error al conectar con el servidor.");
            }
        }

        function reiniciarEscaneo() {
            clienteActualId = null;
            iniciarCamara();
        }

        window.addEventListener("DOMContentLoaded", iniciarCamara);
    </script>
</body>
</html>
