<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Latte&Go</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f4ef;
            color: #333333;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            padding: 28px 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #4a3427;
            margin: 0 0 4px;
        }
        .subtitulo {
            font-size: 0.95rem;
            color: #6b5b50;
            margin: 0 0 18px;
            line-height: 1.4;
        }
        .beneficio-box {
            background: #fdf8f0;
            border: 1px dashed #d4a373;
            border-radius: 12px;
            padding: 14px 12px;
            margin-bottom: 22px;
            font-size: 0.88rem;
            color: #bc6c25;
            font-weight: 600;
            line-height: 1.4;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a3427;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d8cfc4;
            font-size: 1rem;
            box-sizing: border-box;
            background: #faf8f5;
            color: #333;
        }
        input:focus {
            outline: none;
            border-color: #bc6c25;
            background: #ffffff;
        }
        .btn-submit {
            width: 100%;
            background-color: #bc6c25;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-submit:active {
            opacity: 0.9;
        }
        .nota-privacidad {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 16px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="logo-title">Latte&Go 🐾</h1>
        <p class="subtitulo">Programa de Lealtad</p>

        <!-- Aquí va el recuadro de bienvenida con las 2 huellitas -->
        <div class="beneficio-box">
            🎁 ¡Regístrate hoy y recibe tus primeras 2 huellitas de regalo! Al llegar a 10 obtén tu cortesía.
        </div>

        <form id="registro-form" onsubmit="enviarRegistro(event)">
            <div class="form-group">
                <label for="nombre">Tu nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="¿Cómo te decimos?" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de cumpleaños (opcional)</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            </div>

            <button type="submit" class="btn-submit" id="btn-enviar">Obtener mi Tarjeta Digital</button>
        </form>

        <p class="nota-privacidad">
            Si ya tienes tarjeta registrada, solo ingresa tu correo y nombre registrados para abrirla de inmediato.
        </p>
    </div>

    <script>
        async function enviarRegistro(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-enviar");
            btn.disabled = true;
            btn.textContent = "Generando tarjeta...";

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const fechaNacimiento = document.getElementById("fecha_nacimiento").value;

            const payload = {
                nombre: nombre,
                correo: correo,
                fecha_nacimiento: fechaNacimiento ? fechaNacimiento : null
            };

            try {
                const res = await fetch("/api/clientes/registro", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "Error al procesar el registro.");
                    btn.disabled = false;
                    btn.textContent = "Obtener mi Tarjeta Digital";
                    return;
                }

                // Redirige usando el token seguro
                window.location.href = `/tarjeta/${data.token}`;
            } catch (err) {
                alert("Error de conexión. Inténtalo de nuevo.");
                btn.disabled = false;
                btn.textContent = "Obtener mi Tarjeta Digital";
            }
        }
    </script>
</body>
</html>
